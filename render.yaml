# Render Blueprint Configuration
# Deploy both frontend and backend as a single web service
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: english-learning-tool
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false  # Manual entry required in Render dashboard (fallback provider)
      - key: CLIPROXY_BASE_URL
        sync: false  # Public tunnel URL of local CLIProxyAPI, e.g. https://cliproxy.example.com
      - key: CLIPROXY_API_KEY
        sync: false  # One of access.api-keys in CLIProxyAPI config.yaml
      - key: CLIPROXY_MODEL
        value: claude-haiku-5-5
