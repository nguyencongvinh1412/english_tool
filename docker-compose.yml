# English Tool - local stack
# Full stack:     docker compose up -d --build   -> http://localhost:3002
# DB only (dev):  docker compose up -d db && npm run dev
#
# The app reaches the separately-run CLIProxyAPI container through the host:
# CLIPROXY_BASE_URL=http://host.docker.internal:8317
name: english-tool

services:
  db:
    image: postgres:16-alpine
    container_name: english-tool-db
    environment:
      POSTGRES_DB: english_tool
      POSTGRES_USER: english
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - english-tool-pgdata:/var/lib/postgresql/data
      # Creates english_tool_test for the test suite on first start
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Exposed on localhost only, for `npm run dev` and DB tools
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english -d english_tool"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - english-tool-net

  app:
    build: .
    image: english-tool-app
    container_name: english-tool-app
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgres://english:${DB_PASSWORD}@db:5432/english_tool
      CLIPROXY_BASE_URL: http://host.docker.internal:8317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - english-tool-net

volumes:
  english-tool-pgdata:
    name: english-tool-pgdata

networks:
  english-tool-net:
    name: english-tool-net
